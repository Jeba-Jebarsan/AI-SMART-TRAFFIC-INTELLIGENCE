<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#0a1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- subtle lane lines -->
  <g opacity="0.10" stroke="#7dd3fc" stroke-width="3">
    <line x1="0" y1="300" x2="1200" y2="248"/>
    <line x1="0" y1="330" x2="1200" y2="278"/>
  </g>
  <g opacity="0.9" stroke-dasharray="26 22" stroke="url(#accent)" stroke-width="4" opacity="0.35">
    <line x1="0" y1="315" x2="1200" y2="263"/>
  </g>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- signal chip -->
  <g transform="translate(70,110)">
    <rect x="0" y="0" width="70" height="150" rx="16" fill="#0e1730" stroke="#1f2b4d" stroke-width="2"/>
    <circle cx="35" cy="35" r="17" fill="#ef4444" filter="url(#glow)"/>
    <circle cx="35" cy="75" r="17" fill="#f59e0b" opacity="0.55"/>
    <circle cx="35" cy="115" r="17" fill="#22c55e" opacity="0.55"/>
  </g>

  <text x="185" y="150" fill="#e5edff" font-size="58" font-weight="800" letter-spacing="0.5">AI Smart Traffic</text>
  <text x="185" y="212" fill="url(#accent)" font-size="58" font-weight="800" letter-spacing="0.5" filter="url(#glow)">Intelligence Platform</text>
  <text x="188" y="258" fill="#9fb3d1" font-size="24" font-weight="500">Turning any live camera feed into fair, evidence-based enforcement</text>

  <!-- feature pills -->
  <g font-size="18" font-weight="600" fill="#cfe1ff">
    <g transform="translate(188,290)">
      <rect x="0" y="0" width="150" height="40" rx="20" fill="#12224a" stroke="#294a8f" stroke-width="1.5"/>
      <text x="20" y="26">YOLOv8 + ByteTrack</text>
    </g>
    <g transform="translate(352,290)">
      <rect x="0" y="0" width="132" height="40" rx="20" fill="#12224a" stroke="#294a8f" stroke-width="1.5"/>
      <text x="18" y="26">9 Violations</text>
    </g>
    <g transform="translate(498,290)">
      <rect x="0" y="0" width="92" height="40" rx="20" fill="#12224a" stroke="#294a8f" stroke-width="1.5"/>
      <text x="20" y="26">ANPR</text>
    </g>
    <g transform="translate(604,290)">
      <rect x="0" y="0" width="182" height="40" rx="20" fill="#12224a" stroke="#294a8f" stroke-width="1.5"/>
      <text x="18" y="26">Calibrated Speed</text>
    </g>
    <g transform="translate(800,290)">
      <rect x="0" y="0" width="150" height="40" rx="20" fill="#12224a" stroke="#294a8f" stroke-width="1.5"/>
      <text x="18" y="26">Auto e-Challan</text>
    </g>
  </g>

  <!-- detection boxes motif -->
  <g transform="translate(980,70)" opacity="0.95">
    <rect x="0" y="0" width="150" height="95" rx="8" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <rect x="0" y="-14" width="70" height="16" rx="3" fill="#22d3ee"/>
    <text x="6" y="-2" font-size="12" font-weight="700" fill="#03202a">CAR 82 km/h</text>
    <rect x="70" y="40" width="95" height="70" rx="8" fill="none" stroke="#ef4444" stroke-width="3"/>
    <rect x="70" y="26" width="92" height="16" rx="3" fill="#ef4444"/>
    <text x="76" y="38" font-size="12" font-weight="700" fill="#2a0303">NO HELMET</text>
  </g>
</svg>
