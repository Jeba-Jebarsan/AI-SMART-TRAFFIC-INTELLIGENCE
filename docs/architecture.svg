<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0e1630"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="1200" height="440" fill="url(#abg)"/>
  <rect x="0" y="0" width="1200" height="5" fill="#22d3ee"/>
  <text x="40" y="52" fill="#e5edff" font-size="30" font-weight="800">How it works — the AI pipeline</text>

  <!-- row of stages -->
  <g font-family="Segoe UI, Roboto, Arial, sans-serif">
    <!-- 1 -->
    <g transform="translate(40,110)">
      <rect width="180" height="90" rx="14" fill="#101d3d" stroke="#22d3ee" stroke-width="2"/>
      <text x="90" y="40" text-anchor="middle" fill="#7dd3fc" font-size="30">📹</text>
      <text x="90" y="70" text-anchor="middle" fill="#dbe7ff" font-size="17" font-weight="700">Live feed</text>
      <text x="90" y="88" text-anchor="middle" fill="#8fa6c9" font-size="12">CCTV · phone · drone</text>
    </g>
    <line x1="220" y1="155" x2="268" y2="155" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
    <!-- 2 -->
    <g transform="translate(270,110)">
      <rect width="190" height="90" rx="14" fill="#101d3d" stroke="#3b82f6" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" fill="#93c5fd" font-size="26">🧠</text>
      <text x="95" y="70" text-anchor="middle" fill="#dbe7ff" font-size="16" font-weight="700">YOLOv8 + ByteTrack</text>
      <text x="95" y="88" text-anchor="middle" fill="#8fa6c9" font-size="12">detect + persistent IDs</text>
    </g>
    <line x1="460" y1="155" x2="508" y2="155" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
    <!-- 3 -->
    <g transform="translate(510,110)">
      <rect width="190" height="90" rx="14" fill="#101d3d" stroke="#3b82f6" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" fill="#93c5fd" font-size="26">📐</text>
      <text x="95" y="70" text-anchor="middle" fill="#dbe7ff" font-size="16" font-weight="700">Homography</text>
      <text x="95" y="88" text-anchor="middle" fill="#8fa6c9" font-size="12">pixels → metres → km/h</text>
    </g>
    <line x1="700" y1="155" x2="748" y2="155" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
    <!-- 4 -->
    <g transform="translate(750,110)">
      <rect width="200" height="90" rx="14" fill="#101d3d" stroke="#f59e0b" stroke-width="2"/>
      <text x="100" y="40" text-anchor="middle" fill="#fbbf24" font-size="26">⚖️</text>
      <text x="100" y="70" text-anchor="middle" fill="#dbe7ff" font-size="16" font-weight="700">Violation engine</text>
      <text x="100" y="88" text-anchor="middle" fill="#8fa6c9" font-size="12">rules + false-positive gates</text>
    </g>
    <line x1="950" y1="155" x2="998" y2="155" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
    <!-- 5 -->
    <g transform="translate(1000,110)">
      <rect width="160" height="90" rx="14" fill="#101d3d" stroke="#22c55e" stroke-width="2"/>
      <text x="80" y="40" text-anchor="middle" fill="#4ade80" font-size="26">🔢</text>
      <text x="80" y="70" text-anchor="middle" fill="#dbe7ff" font-size="16" font-weight="700">ANPR + evidence</text>
      <text x="80" y="88" text-anchor="middle" fill="#8fa6c9" font-size="12">plate + snapshot</text>
    </g>
  </g>

  <!-- down to challan -->
  <line x1="1080" y1="200" x2="1080" y2="250" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(940,250)">
    <rect width="220" height="80" rx="14" fill="#12224a" stroke="#22c55e" stroke-width="2"/>
    <text x="110" y="36" text-anchor="middle" fill="#e5edff" font-size="17" font-weight="700">📧 e-Challan</text>
    <text x="110" y="60" text-anchor="middle" fill="#8fa6c9" font-size="12">PDF + police email + fine</text>
  </g>

  <!-- dashboard box -->
  <g transform="translate(40,250)">
    <rect width="860" height="150" rx="16" fill="#0e1a38" stroke="#294a8f" stroke-width="2"/>
    <text x="24" y="42" fill="#e5edff" font-size="20" font-weight="800">Live "traffic control centre" dashboard</text>
    <g font-size="14" font-weight="600" fill="#cfe1ff">
      <g transform="translate(24,64)"><rect width="150" height="34" rx="17" fill="#12224a" stroke="#294a8f"/><text x="16" y="22">🚨 Violations feed</text></g>
      <g transform="translate(186,64)"><rect width="168" height="34" rx="17" fill="#12224a" stroke="#294a8f"/><text x="14" y="22">🚘 Vehicles · ANPR</text></g>
      <g transform="translate(366,64)"><rect width="150" height="34" rx="17" fill="#12224a" stroke="#294a8f"/><text x="16" y="22">📸 Photo evidence</text></g>
      <g transform="translate(528,64)"><rect width="150" height="34" rx="17" fill="#12224a" stroke="#294a8f"/><text x="18" y="22">📈 AI insights</text></g>
    </g>
    <text x="24" y="128" fill="#8fa6c9" font-size="14">9 violation types · calibrated speed · honest-by-design (no mock data, no invented plates, no fines on parked vehicles)</text>
  </g>
</svg>
